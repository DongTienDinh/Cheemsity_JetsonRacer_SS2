# Model Option B #1 (Ưu tiên tốc độ >= 25 FPS): LaneTiny-Fast (DW-UNet base=16, 3 kênh + Reg)
#   - 56,566 params (~487 KB ONNX kèm CoordConv), 109.7 MFLOPs, 80 ONNX nodes, 0 SE blocks
#   - Nhẹ hơn LaneTiny-ResSE 2.77x params / 30% MFLOPs / bỏ toàn bộ 5 khối SE (tối ưu TRT 7.1.3 Maxwell)
#   - Test locked (198 frames): Road IoU 0.987 | White IoU 0.921 | Center IoU 0.287
#     CTE MAE 0.0260 (gần ngang ResSE 0.0248) | Lookahead MAE 0.0588
#
# Cách dùng trên Jetson Nano:
#   1. Build engine TRÊN CHÍNH XE:
#        python3 tools/setup_jetson_models.py --model fast
#      (hoặc:
#        /usr/src/tensorrt/bin/trtexec --onnx=models/lane_option_b_fast.onnx \
#            --fp16 --workspace=256 --saveEngine=models/lane_option_b_fast.engine)
#   2. Đo latency & kiểm tra DẤU cte:
#        python3 tools/bench_lane_cnn.py --override configs/cnn_option_b_fast.yaml
#        python3 tools/bench_lane_cnn.py --override configs/cnn_option_b_fast.yaml --watch --source csi
#   3. Chạy xe (CLI không tốn CPU cho UI Jupyter):
#        python3 -m src.jetracer_baseline.cli run --task speed --driver nvidia \
#            --override configs/cnn_option_b_fast.yaml --record

# Tối ưu băng thông & CPU Jetson Nano:
#   - nvvidconv (phần cứng VIC) scale 1280x720 -> 320x240 trực tiếp -> giảm 4x tải videoconvert CPU & copy RAM
#   - shading chạy trong pipeline ở 320x240 thay vì 640x480@30fps ở luồng camera -> giảm 4x tải CPU shading
camera:
  width: 320
  height: 240
  shading:
    apply_at: pipeline

# Khi đang dừng/đặt xe giữ preview 5 Hz; khi bấm CHAY tự động hạ preview về 1 Hz
# để tránh tranh CPU/GIL gây spike 100-170 ms trên Jetson Nano.
tuning:
  preview_hz: 5
  run_preview_hz: 1.0

lane:
  mode: cnn
  cnn:
    backend: trt
    engine: models/lane_option_b_fast.engine
    # Hình học KHỚP TUYỆT ĐỐI với tools/train_lane_option_b.py (KHÔNG đổi khi chưa train lại)
    roi_top: 0.34
    warp_src: [[0.00, 0.92], [1.00, 0.92], [0.66, 0.42], [0.33, 0.42]]
    warp_dst_margin: 0.32
    min_bands: 2
    band_min_pixels: 8
    lookahead: 0.60
    check_reg: true
    reg_disagree: 0.35
    # Khi Ch2 yeu o cua gat, suy tam tu mep mat duong Ch0.
    single_line_offset_px: 108.0  # Khoang cach tu mep vao trong mat duong, BEV 320x240.

# Gain điều khiển CNN (kế thừa profile configs/cnn.yaml)
control:
  pid:
    kp: 1.10
    kd: 0.12
  steer_lookahead_weight: 0.70
  curve_enter: 0.12
  curve_exit: 0.08
  curve_feedforward: 1.80
  corner_steer_gain: 2.40
  slowdown: 0.20
  curve_brake: 0.30
  corner_hold_s: 0.70
  steer_max: 1.00
  corner_steer_max: 1.00
  driver:
    steering_gain: -1.00
    throttle_gain: 1.00
