# Chế độ DỰ PHÒNG cho Speed Track: Road-Only Pure Pursuit + LaneTiny-ResSE (25-30 FPS Nano)
#   - Giữ nguyên 100% configs/default.yaml; dùng ResSE khi sân có bóng đổ / chói đèn mạnh.

camera:
  width: 320
  height: 240
  shading:
    apply_at: pipeline

tuning:
  preview_hz: 5
  run_preview_hz: 1.0

lane:
  mode: cnn
  cnn:
    backend: trt
    engine: models/lane_road_only_resse.engine
    road_only: true
    roi_top: 0.34
    warp_src: [[0.00, 0.92], [1.00, 0.92], [0.66, 0.42], [0.33, 0.42]]
    warp_dst_margin: 0.32

control:
  mode: pure_pursuit
  # 9 tham so UI da chuan hoa theo profile chay that tren xe:
  v_straight: 0.38
  v_corner: 0.30
  v_max: 0.475
  curve_enter: 0.06
  curve_exit: 0.039
  curve_feedforward: 2.20
  road_turn_steer_gain: 1.40
  road_turn_release_s: 0.00
  corner_enter_delay_s: 0.00
  curvy_zone_enabled: false
  curvy_steer_boost: 1.20
  curvy_lookahead_scale: 0.65
  pre_corner_decel: 0.90
  curve_brake: 0.00
  slowdown: 0.32
  steer_max: 1.00
  corner_steer_max: 1.00
  driver:
    steering_output_min: -1.00
    steering_output_max: 1.00
  pure_pursuit:
    lookahead_px: 88.0
    gain: 1.15
    half_lane_px: 82.0
    wheel_deg_at_limit: 34.0
    servo_ref_at_limit: 0.39
    car_length_px: 76.0
    edge_margin_px: 54.0
    edge_push_gain: 0.45
    steer_smooth: 0.72
    max_hole_area: 180
