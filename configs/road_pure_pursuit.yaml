# Chế độ KHUYÊN DÙNG cho Speed Track: Road-Only Pure Pursuit + LaneTiny-Fast (30+ FPS Nano)
#   - Mặc định tốc độ mô phỏng AN TOÀN (TOC DO thang = 0.30, TOC DO trong cua = 0.12) để dễ kiểm
#     soát khi mới thả xe, sau đó kéo tăng tốc trực tiếp trên UI theo sa bàn thật.
#   - Mở khóa sẵn 100% tầm servo (steering_gain = -1.00, GOC LAI TOI DA = 1.00, LAI CUA GAT = 1.40)
#     + cam kết đánh hết lái qua cua chữ U; giữ nguyên configs/default.yaml không sửa.
#
# Cách chạy trên Jetson Nano:
#   python3 -m src.jetracer_baseline.cli run --task speed --driver nvidia \
#       --override configs/road_pure_pursuit.yaml --record

camera:
  width: 320
  height: 240
  shading:
    apply_at: pipeline

tuning:
  preview_hz: 5
  run_preview_hz: 1.0

lane:
  mode: cnn
  cnn:
    backend: trt
    # Model cat tia 1 kenh Ch0 (bo Ch1/Ch2 + reg_head -> giam 3x copy GPU->CPU)
    engine: models/lane_road_only_fast.engine
    road_only: true
    # Hình học KHỚP TUYỆT ĐỐI với tools/train_lane_option_b.py
    roi_top: 0.34
    warp_src: [[0.00, 0.92], [1.00, 0.92], [0.66, 0.42], [0.33, 0.42]]
    warp_dst_margin: 0.32

control:
  mode: pure_pursuit
  # Mac dinh toc do mo phong an toan (de tu keo tang dan tren san) + full-lock cua chu U:
  v_straight: 0.30
  v_corner: 0.12
  v_max: 0.375
  throttle_rise_rate: 1.40
  # CUA SOM mac dinh 0.50 (curve_enter=0.18 -> khong bi cua som; keo xuong 0.00 cang chong cua som)
  curve_enter: 0.18
  curve_exit: 0.117
  curve_feedforward: 1.40
  road_turn_steer_gain: 1.40
  road_turn_release_s: 0.00
  # TRE VAO CUA 0.14s: giam ga ngay nhung di sau them 1 nhip truoc khi be het lai (chong cat som chu U)
  corner_enter_delay_s: 0.14
  curvy_zone_enabled: true
  curvy_steer_boost: 1.15
  curvy_lookahead_scale: 0.85
  curvy_speed_scale: 0.90
  pre_corner_decel: 0.50
  curve_brake: 0.00
  slowdown: 0.20
  steer_max: 1.00
  corner_steer_max: 1.00
  driver:
    # Mo khoa 100% suc manh ca lai lan ga (keo thanh len max 1.00 = bung 100% motor & servo!)
    steering_gain: -1.00
    throttle_gain: 1.00
    steering_output_min: -1.00
    steering_output_max: 1.00
  pure_pursuit:
    lookahead_px: 78.0
    gain: 1.15
    half_lane_px: 82.0
    wheel_deg_at_limit: 34.0
    servo_ref_at_limit: 0.56
    car_length_px: 76.0
    edge_margin_px: 56.0
    edge_push_gain: 0.65
    steer_smooth: 0.72
    max_hole_area: 180
