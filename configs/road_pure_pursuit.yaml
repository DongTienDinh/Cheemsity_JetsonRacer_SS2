# Chế độ KHUYÊN DÙNG cho Speed Track: Road-Only Pure Pursuit + LaneTiny-Fast (30+ FPS Nano)
#   - Đã chuẩn hóa theo profile chạy thực tế trên xe (TOC DO 0.38 / 0.30, GOC LAI TOI DA 1.00,
#     GIAM TOC TRUOC CUA 0.90) — giữ nguyên configs/default.yaml không sửa.
#   - Chỉ dùng duy nhất kênh Ch0 (drivable_road) của model 1 kênh (bỏ Ch1 trắng, Ch2 tâm ảo & LiDAR).
#
# Cách chạy trên Jetson Nano:
#   python3 -m src.jetracer_baseline.cli run --task speed --driver nvidia \
#       --override configs/road_pure_pursuit.yaml --record

camera:
  width: 320
  height: 240
  shading:
    apply_at: pipeline

tuning:
  preview_hz: 5
  run_preview_hz: 1.0

lane:
  mode: cnn
  cnn:
    backend: trt
    # Model cat tia 1 kenh Ch0 (bo Ch1/Ch2 + reg_head -> giam 3x copy GPU->CPU)
    engine: models/lane_road_only_fast.engine
    road_only: true
    # Hình học KHỚP TUYỆT ĐỐI với tools/train_lane_option_b.py
    roi_top: 0.34
    warp_src: [[0.00, 0.92], [1.00, 0.92], [0.66, 0.42], [0.33, 0.42]]
    warp_dst_margin: 0.32

control:
  mode: pure_pursuit
  # 9 tham so UI da chuan hoa theo profile chay that tren xe:
  v_straight: 0.38
  v_corner: 0.30
  v_max: 0.475
  curve_enter: 0.06
  curve_exit: 0.039
  curve_feedforward: 2.20
  road_turn_steer_gain: 1.40
  road_turn_release_s: 0.00
  corner_enter_delay_s: 0.00
  curvy_zone_enabled: false
  curvy_steer_boost: 1.20
  curvy_lookahead_scale: 0.65
  pre_corner_decel: 0.90
  curve_brake: 0.00
  slowdown: 0.32
  steer_max: 1.00
  corner_steer_max: 1.00
  driver:
    steering_output_min: -1.00
    steering_output_max: 1.00
  pure_pursuit:
    lookahead_px: 88.0
    gain: 1.15
    half_lane_px: 82.0
    wheel_deg_at_limit: 34.0
    servo_ref_at_limit: 0.39
    car_length_px: 76.0
    edge_margin_px: 54.0
    edge_push_gain: 0.45
    steer_smooth: 0.72
    max_hole_area: 180
