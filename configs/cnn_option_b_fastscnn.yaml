# Model Option B #2 (Dự phòng / A-B test): FastSCNN-Lane (3 kênh + Reg)
#   - 330,614 params (~1.3 MB ONNX), 368.4 MFLOPs — Dual-branch + Pyramid Pooling
#   - Test locked (198 frames): Road IoU 0.991 | White IoU 0.940 | Center IoU 0.298
#     CTE MAE 0.0242 (thấp nhất) | Lookahead MAE 0.0638
#   - Phù hợp làm phương án A/B test trên sa bàn hoặc khi cần biên vạch trắng sắc nét tối đa
#
# Cách dùng trên Jetson Nano:
#   1. Build engine TRÊN CHÍNH XE:
#        /usr/src/tensorrt/bin/trtexec --onnx=models/lane_option_b_fastscnn.onnx \
#            --fp16 --workspace=256 --saveEngine=models/lane_option_b_fastscnn.engine
#   2. Đo latency & kiểm tra DẤU cte:
#        python3 tools/bench_lane_cnn.py --override configs/cnn_option_b_fastscnn.yaml
#        python3 tools/bench_lane_cnn.py --override configs/cnn_option_b_fastscnn.yaml --watch --source csi
#   3. Chạy xe:
#        python3 -m src.jetracer_baseline.cli run --task speed --driver nvidia \
#            --override configs/cnn_option_b_fastscnn.yaml --record

# Tối ưu CPU Jetson Nano (nvvidconv xuất 320x240 trực tiếp, shading 320x240, hạ preview khi chạy)
camera:
  width: 320
  height: 240
  shading:
    apply_at: pipeline

tuning:
  preview_hz: 5
  run_preview_hz: 1.0

lane:
  mode: cnn
  cnn:
    backend: trt
    engine: models/lane_option_b_fastscnn.engine
    # Hình học KHỚP TUYỆT ĐỐI với tools/train_lane_option_b.py (KHÔNG đổi khi chưa train lại)
    roi_top: 0.34
    warp_src: [[0.00, 0.92], [1.00, 0.92], [0.66, 0.42], [0.33, 0.42]]
    warp_dst_margin: 0.32
    min_bands: 2
    band_min_pixels: 8
    lookahead: 0.60
    check_reg: true
    reg_disagree: 0.35
    # Chi bam DUNG phan vang (Ch2 centerline) model du doan, KHONG tu suy fallback
    road_fallback: false

# Gain điều khiển CNN (kế thừa profile configs/cnn.yaml)
control:
  pid:
    kp: 1.10
    kd: 0.12
  steer_lookahead_weight: 0.70
  curve_enter: 0.12
  curve_exit: 0.08
  curve_feedforward: 1.80
  corner_steer_gain: 2.40
  slowdown: 0.20
  curve_brake: 0.30
  corner_hold_s: 0.70
  steer_max: 1.00
  corner_steer_max: 1.00
  driver:
    steering_gain: -1.00
    throttle_gain: 1.00
